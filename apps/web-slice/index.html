<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بنكوو — عالم بنكوو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* VOICE: warm, encouraging, one idea per screen — Bankoo the squirrel talks, the child acts.
   IDEA: a sunny storybook town seen through a phone; cards are glassy signboards.
   PICTURE: the user's own mascot art, characters and drawn learning map.
   COLOUR: Bankoo blue #1854D6 / navy #103B91 sky, squirrel orange #F28C28 for actions, reward yellow #FFC83D.
   TYPE: Baloo Bhaijaan 2 for headings & numbers, Tajawal for reading. LAYOUT: phone column, max 480px. */
:root{--blue:#1854D6;--navy:#103B91;--orange:#F28C28;--yellow:#FFC83D;--green:#35B879;--paper:#F8FAFF;--ink:#182B49;--red:#E5484D;
  --glass:rgba(255,255,255,.82);--line:rgba(24,84,214,.14);--shadow:0 10px 30px -12px rgba(16,59,145,.35);color-scheme:light}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:17px/1.6 Tajawal,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#2a6ef0,#9cc8ff 38%,#dceeff 70%,#eaf6e8);background-attachment:fixed;overflow-x:clip}
h1,h2,h3,.num{font-family:"Baloo Bhaijaan 2",Tajawal,sans-serif;line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
img{display:block;max-width:100%}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding:12px 14px 110px}
.sky{position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(60px 26px at 15% 12%,#fff8 60%,transparent 62%),radial-gradient(80px 30px at 85% 18%,#fffa 60%,transparent 62%),
  radial-gradient(70px 24px at 70% 6%,#fff6 60%,transparent 62%)}
.ground{position:fixed;inset:auto 0 0 0;height:120px;z-index:-1;background:radial-gradient(120% 90px at 50% 100%,#8fd16a 60%,transparent 61%);opacity:.55;pointer-events:none}

/* header + logo */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-shadow:0 2px 0 #0b2e74}
.logo svg{width:44px;height:44px}
.logo b{font:800 30px/1 "Baloo Bhaijaan 2";display:block}
.logo small{font:800 13px/1 Tajawal;letter-spacing:.12em;display:block;direction:ltr;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:var(--shadow)}
.avatar-sm{width:40px;height:40px;border-radius:50%;border:3px solid var(--yellow);object-fit:cover;background:#fff}

/* bubbles & mascot */
.hero{display:grid;grid-template-columns:42% 1fr;align-items:center;gap:4px;min-height:230px}
.hero .mascot{width:100%;filter:drop-shadow(0 12px 14px rgba(16,59,145,.35))}
.bubble{position:relative;background:linear-gradient(#2160e4,var(--navy));color:#fff;border-radius:28px;padding:16px 18px;box-shadow:var(--shadow);border:3px solid #fff3}
.bubble:after{content:"";position:absolute;inset-inline-end:-14px;top:42%;border:12px solid transparent;border-inline-start-color:var(--navy)}
.bubble h1{font-size:clamp(26px,7vw,34px)}
.bubble em{font-style:normal;color:var(--yellow)}
.bubble p{margin:6px 0 0;font-weight:700}
.sub{background:#fffe;color:var(--ink);border-radius:22px;padding:10px 14px;margin-top:10px;font-weight:800;box-shadow:var(--shadow)}

/* cards */
.card{background:var(--glass);backdrop-filter:blur(8px);border:2px solid #fff;border-radius:26px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card h2{font-size:22px}
.tag{display:inline-block;background:linear-gradient(var(--blue),var(--navy));color:#fff;border-radius:999px;padding:4px 16px;font:800 16px/1.5 Tajawal}
.tag.o{background:linear-gradient(#ffa64d,var(--orange))}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.feat{display:flex;align-items:center;gap:10px;border-radius:24px;padding:12px;min-height:110px;font:800 20px/1.25 "Baloo Bhaijaan 2";box-shadow:var(--shadow);border:2px solid #fff}
.feat>div{flex:1}.feat img{flex:0 0 40%;width:40%;max-height:90px;object-fit:contain}
.feat:nth-child(1){background:#fff3df}.feat:nth-child(2){background:#e3f0ff}.feat:nth-child(3){background:#e5f7e7}.feat:nth-child(4){background:#eceaff}
.feat small{display:block;font:600 13px/1.35 Tajawal;color:#3d4d6b;margin-top:4px}
.journey{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;text-align:center;font-weight:800;font-size:13px}
.journey div{flex:1}.journey img{height:56px;margin:0 auto 4px;object-fit:contain}
.journey i{font-style:normal;color:var(--orange);font-size:22px;align-self:center;transform:scaleX(-1)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:999px;font:800 22px/1 "Baloo Bhaijaan 2";
  background:linear-gradient(#ffa24a,var(--orange) 55%,#e06f0c);color:#fff;box-shadow:0 6px 0 #c35d06,0 14px 24px -8px #c35d0688;transition:transform .18s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c35d06}
.btn .play{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.btn .play:before{content:"";border:9px solid transparent;border-inline-end:13px solid var(--orange);margin-inline-end:6px}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 4px 0 #c8d6f5;border:2px solid var(--blue);font-size:18px;min-height:52px}
.btn.green{background:linear-gradient(#57d394,var(--green));box-shadow:0 6px 0 #22875a}
.btn.small{min-height:44px;font-size:17px;width:auto;padding:0 18px}
.btn[disabled]{filter:grayscale(.8);opacity:.6;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.listen{position:fixed;inset-inline-start:max(12px,calc(50% - 228px));bottom:96px;width:62px;height:62px;border-radius:20px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.listen svg{width:30px;height:30px;color:var(--blue)}

/* inputs */
.field{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid #cfe0ff;border-radius:999px;padding:4px 18px}
.field input{border:0;outline:0;font:800 24px/1.6 "Baloo Bhaijaan 2";width:100%;background:none;color:var(--ink)}
.ages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ages button,.levels button{background:#fff;border:2px solid #d7e5ff;border-radius:16px;min-height:52px;font:800 22px "Baloo Bhaijaan 2";box-shadow:0 3px 0 #d7e5ff}
.ages button[aria-pressed=true],.levels button[aria-pressed=true]{background:linear-gradient(#ffb35c,var(--orange));color:#fff;border-color:#fff;box-shadow:0 3px 0 #c35d06}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.levels button{font-size:17px}
.steps{display:flex;gap:6px;align-items:center;justify-content:center}.steps i{width:12px;height:12px;border-radius:50%;background:#c9dbff}.steps i.on{background:var(--orange);width:28px;border-radius:9px}
.avatars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avatars button{border-radius:20px;overflow:hidden;border:4px solid transparent;box-shadow:var(--shadow);position:relative}
.avatars button[aria-pressed=true]{border-color:var(--orange)}
.avatars button[aria-pressed=true]:after{content:"✓";position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;display:grid;place-items:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfe0ff}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--orange)}
.avatar-frame{border-radius:50%;overflow:hidden;border:5px solid var(--shirt,var(--blue));background:#fff}

/* wallet */
.balance{display:flex;align-items:center;gap:12px}
.balance .num{font-size:52px;color:var(--orange);text-shadow:0 2px 0 #fff}
.coin{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,var(--yellow) 55%,#e9a500);box-shadow:inset 0 -2px 0 #c98d00;vertical-align:-.2em}
.coin svg{width:62%;height:62%;color:#b07400}
.bar{height:16px;border-radius:999px;background:#dfe9fb;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#7be0a9);border-radius:inherit;transition:width .6s}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.mini div{background:#fff;border-radius:16px;padding:8px 4px;font-weight:800;font-size:14px}.mini b{display:block;font:800 26px "Baloo Bhaijaan 2"}
.ledger{list-style:none;margin:0;padding:0}.ledger li{display:flex;justify-content:space-between;gap:8px;padding:10px 2px;border-bottom:1px dashed var(--line);font-weight:700}
.ledger li small{display:block;color:#5c6d8c;font-weight:500;font-size:13px}
.plus{color:var(--green)}.minus{color:var(--red)}
.vcard{position:relative;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#2b6cf0,var(--navy) 70%);box-shadow:var(--shadow);overflow:hidden;aspect-ratio:1.6}
.vcard:before{content:"";position:absolute;inset:auto -30% -60% auto;width:90%;height:120%;border-radius:50%;background:#ffffff14}
.vcard .chipz{width:46px;height:34px;border-radius:8px;background:linear-gradient(135deg,#ffe58a,#e9a500);margin:16px 0 12px}
.vcard .id{font:800 20px "Baloo Bhaijaan 2";direction:ltr;text-align:right;letter-spacing:.06em}
.vcard .train{position:absolute;bottom:14px;inset-inline-start:14px;background:var(--yellow);color:var(--ink);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px}
.vcard img{position:absolute;top:14px;inset-inline-start:14px;width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:#fff}

/* nav */
.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  background:#fff;border-radius:28px;box-shadow:0 10px 30px -8px #103b9166;padding:6px;z-index:6}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:20px;font-weight:800;font-size:13px;color:var(--navy);min-height:56px}
.nav svg{width:26px;height:26px}
.nav button[aria-current=page]{background:linear-gradient(#ffa64d,var(--orange));color:#fff}

/* map */
.mapwrap{border-radius:26px;overflow:auto;box-shadow:var(--shadow);border:3px solid #fff;max-height:70vh;overscroll-behavior:contain}
.map{position:relative;width:max(100%,760px)}
.map img{width:100%}
.node{position:absolute;width:10.5%;min-width:44px;aspect-ratio:1;border-radius:50%;transform:translate(50%,-50%)}
.node .st{position:absolute;top:-12%;inset-inline-start:-14%;width:42%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(9px,2.4vw,13px);border:2px solid #fff;box-shadow:0 2px 6px #0004}
.node.done .st{background:var(--green)}.node.open .st{background:var(--orange);animation:pulse 1.4s infinite}.node.locked .st{background:#7b88a6}
.node.locked:before{content:"";position:absolute;inset:0;border-radius:50%;background:#1b2b4a55}
@keyframes pulse{50%{transform:scale(1.18)}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-weight:700;font-size:14px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:16px;height:16px;border-radius:50%}

/* lesson player */
.player{min-height:calc(100vh - 140px);display:flex;flex-direction:column;gap:12px}
.ptop{display:flex;align-items:center;gap:10px}.ptop .bar{flex:1}
.x{width:44px;height:44px;border-radius:14px;background:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
.stage{display:grid;grid-template-columns:38% 1fr;align-items:end;gap:6px}
.stage img.pose{width:100%;filter:drop-shadow(0 10px 12px #103b9155)}
.say{background:#fff;border-radius:24px;padding:16px;font:700 19px/1.6 Tajawal;box-shadow:var(--shadow);position:relative}
.say:after{content:"";position:absolute;bottom:22px;inset-inline-end:-12px;border:10px solid transparent;border-inline-start-color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{background:#fff;border:3px solid #d7e5ff;border-radius:22px;padding:12px;font:800 18px/1.3 Tajawal;display:grid;justify-items:center;gap:8px;min-height:64px;box-shadow:0 4px 0 #d7e5ff;transition:transform .2s}
.opt img{height:70px;object-fit:contain}
.opt.ok{border-color:var(--green);background:#e9fbf1;box-shadow:0 4px 0 #9fdcbc}
.opt.no{border-color:#f3b0a9;background:#fff4f2;animation:shake .35s}
.opt.pick{border-color:var(--orange);background:#fff3e3}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.hint{background:#fff8e1;border:2px dashed var(--yellow);border-radius:18px;padding:12px;font-weight:700}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bin{background:#fff;border-radius:20px;padding:10px;min-height:120px;border:3px dashed #cfe0ff}
.bin h3{font-size:18px;text-align:center;margin-bottom:6px}.bin .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.bin .got img{height:40px}
.pile{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pile button{background:#fff;border-radius:18px;padding:8px 12px;box-shadow:var(--shadow);font-weight:800;display:grid;justify-items:center;border:3px solid transparent}
.pile button img{height:54px}.pile button.sel{border-color:var(--orange)}
.counter{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.counter .num{font-size:44px}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.coins .coin{font-size:40px;transition:transform .3s,opacity .3s}.coins .coin.gone{transform:translateY(-30px) scale(.4);opacity:0}
.safe{width:120px;margin:auto}
.footer{margin-top:auto;display:grid;gap:10px}

/* shop */
.prod{background:#fff;border-radius:22px;padding:10px;display:grid;gap:4px;justify-items:center;box-shadow:var(--shadow);text-align:center;font-weight:800;border:2px solid #fff}
.prod img{height:84px;object-fit:contain}.prod .price{font:800 20px "Baloo Bhaijaan 2";color:var(--orange)}
.prod small{color:#5c6d8c;font-weight:600}
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.search{display:flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:4px 14px;border:2px solid #d7e5ff}
.search input{border:0;outline:0;font:700 16px Tajawal;width:100%;min-height:40px;background:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 2px}.cats button{flex:none;background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;border:2px solid #d7e5ff;min-height:40px}
.cats button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.pay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pay button{background:#fff;border:3px solid #d7e5ff;border-radius:20px;padding:12px;font-weight:800;min-height:70px}
.pay button[aria-pressed=true]{border-color:var(--orange);background:#fff3e3}
.flow{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#7b88a6}.flow b{color:var(--orange)}
.receipt{background:#fff;border-radius:6px;padding:18px;font-family:Tajawal;box-shadow:var(--shadow);background-image:radial-gradient(circle at 10px -4px,transparent 8px,#fff 9px);}
.receipt table{width:100%;border-collapse:collapse}.receipt td{padding:6px 0;border-bottom:1px dashed #d7e5ff}.receipt td:last-child{text-align:left}
.disclaimer{font-size:13px;font-weight:800;color:#9a5b00;background:#fff3d6;border-radius:12px;padding:6px 10px;text-align:center;margin-top:10px}

/* inbox / fraud */
.mail{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);width:100%;text-align:start}
.mail .dot{width:12px;height:12px;border-radius:50%;background:var(--red)}
.msg{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);border:3px solid #ffe3a3}
.msg .from{font-size:14px;color:#5c6d8c;font-weight:700}
.flag{background:none;border-bottom:3px dotted transparent;padding:0 2px;font:inherit;font-weight:800;border-radius:6px}
.flag.found{background:#ffe0dc;border-color:var(--red)}
.flag.miss{background:#eef2ff}

/* toast, modal, confetti */
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 20px;font-weight:800;z-index:20;transition:transform .3s;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#0b1e4699;display:grid;place-items:center;z-index:15;padding:16px}
.modal>div{background:var(--paper);border-radius:28px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:18}.burst i{position:absolute;width:10px;height:14px;border-radius:3px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(540deg);opacity:.2}}
.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.in{animation:rise .32s ease-out both}@keyframes rise{from{transform:translateY(14px);opacity:0}}
.stagger>*{animation:rise .35s ease-out both}.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.24s}
.enter{animation:slidein .6s cubic-bezier(.2,1.3,.4,1) both}@keyframes slidein{from{transform:translateX(40%) scale(.8);opacity:0}}
.float{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.muted{color:#5c6d8c;font-size:14px;font-weight:600}
.center{text-align:center}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center;font-weight:800;font-size:13px}
.badges div{background:#fff;border-radius:18px;padding:10px 4px}.badges div.off{opacity:.38;filter:grayscale(1)}
.badges svg{width:44px;height:44px;margin:auto}
.demo{border:2px dashed #9db8ee;background:#f2f7ff}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{body{background:#fff}.nav,.listen,.top,.noprint{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #ccd}}
</style>
</head>
<body>
<div class="sky"></div><div class="ground"></div>
<main class="app" id="app" aria-live="polite"></main>
<nav class="nav" id="nav" hidden></nav>
<button class="listen" id="listen" aria-label="استمع" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/><path d="M10 11v3M12 10v5M14 11v3"/></svg></button>
<div class="toast" id="toast" role="status"></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
